<!DOCTYPE html>
<html lang="en">

<!--- TEST ONLYYY -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tracer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">
        <section class="panel">
            <header class="panel-header">
                <p class="eye">Today&rsquo;s timetable</p>
                <div id="dateDisplay"></div>
            </header>

            <hr>
            <div class="picker">
                <label id="text" for="datePicker">Pick a different date:</label>
                <input type="date" id="datePicker">
            </div>

            <button type="button" id="tmrBtn" class="secondary-btn">Tomorrow's Subjects</button>

            <table>
                <tead>
                    <tr>
                        <th>Period</th>
                        <th>Subject</th>
                    </tr>
                </tead>
                <tbody id="scheduleBody"></tbody>
            </table>

        </section>

        <section class="panel tracker">
            <header class="panel-header">
                <p class="eyebrow">Copy Check Tracker</p>
                <h2 class="panel-title">Subjects</h2>
            </header>

            <hr class="rule">

            <form id="addSubjectForm">
                <input type="text" id="newSubjectInput" placeholder="Subject">
                <button type="submit" class="primary-btn">Add</button>
            </form>

            <ul id="subjectList"></ul>
        </section>

    </main>
    <script src="index.js"></script>
</body>

</html>
