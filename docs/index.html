<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tracer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <p class="brand">School Tracer</p>

    <main class="page">
        <section class="panel">
            <header class="panel-header">
                <div id="dateDisplay"></div>
                <p class="panel-caption">today's classes</p>
            </header>

            <hr class="rule">

            <div class="picker-row">
                <label id="text" for="datePicker">Pick a different date</label>
                <input type="date" id="datePicker">
            </div>

            <button type="button" id="tmrBtn" class="secondary-btn">Show tomorrow's classes</button>

            <table>
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Subject</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>

        </section>

        <section class="panel tracker">
            <header class="panel-header panel-header--left">
                <h2 class="panel-title">Copy check tracker</h2>
                <p class="panel-caption">mark a subject off after each notebook check</p>
            </header>

            <hr class="rule">

            <form class="add-subject-form" id="addSubjectForm">
                <input type="text" id="newSubjectInput" placeholder="Subject name" aria-label="Subject name">
                <button type="submit" class="primary-btn">Add</button>
            </form>

            <ul class="subject-list" id="subjectList"></ul>
        </section>

    </main>
    <script src="index.js"></script>
</body>

</html>
